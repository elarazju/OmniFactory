[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "omnifactory"
version = "0.1.0a8"
description = "Unified Efficient Fine-Tuning of Omni Models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
train = [
    "torch>=2.6,<3",
    "transformers==4.57.6",
    "peft>=0.18,<0.19",
    "accelerate>=1.10,<2",
    "pillow>=11,<13",
    "soundfile>=0.13,<0.14",
    "librosa>=0.11,<0.12",
    "torchvision>=0.21,<1",
    "torchaudio>=2.6,<3",
    "einops>=0.8,<0.9",
]
cuda = ["bitsandbytes>=0.48,<0.49; sys_platform == 'linux'"]
speech = [
    "onnxruntime>=1.20,<2",
    "s3tokenizer==0.3.0",
    "stepaudio2-minicpmo==0.1.1",
]
cosyvoice = [
    "onnxruntime>=1.20,<2",
    "s3tokenizer==0.3.0",
    "omegaconf==2.3.0",
    "x-transformers==2.11.24",
]
image = ["diffusers==0.39.0"]
personaplex = ["sphn==0.1.12", "sentencepiece==0.2.1", "websockets==15.0.1"]

[project.scripts]
omnifactory = "omnifactory.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnifactory"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/scripts", "/docs",
    "/README.md", "/README_zh.md", "/LICENSE", "/pyproject.toml", "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/omnifactory/_vendor"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
