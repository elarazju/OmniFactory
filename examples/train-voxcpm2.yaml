# Native VoxCPM2 continuous CFM + stop prediction. See docs/models.md#voxcpm2.
model: openbmb/VoxCPM2
revision: 32279effe8c19989596f05d353d1447f51d9e915
adapter: voxcpm2
task: speech_sft
dataset: ../outputs/tts-data/train.jsonl
output_dir: ../outputs/voxcpm2-run
device: cuda
dtype: bfloat16
attention: sdpa
quantization: none
gradient_checkpointing: true
max_steps: 100
save_steps: 20
gradient_accumulation_steps: 4
max_length: 512
max_audio_seconds: 8
# For this continuous adapter, the legacy generation bound counts latent patches.
max_codec_tokens: 128
components:
  language_model: {mode: lora, rank: 8, alpha: 16, lr: 0.0001}
  residual_model: {mode: lora, rank: 8, alpha: 16, lr: 0.0001}
  audio_decoder: {mode: lora, rank: 8, alpha: 16, lr: 0.0001}
  speech_projection: {mode: full, lr: 0.00001}
  stop_predictor: {mode: full, lr: 0.00001}
budget:
  max_examples: 1
  max_llm_tokens: 512
  max_vision_patches: 1
  max_audio_frames: 1024
  max_codec_frames: 1
  max_latent_elements: 131072
  max_decoded_media_bytes: 16777216
