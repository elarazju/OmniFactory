# Experimental pretrained CUDA recipe, not hardware-validated. No NF4 support yet.
adapter: minicpm_o_4_5
task: speech_sft
model: openbmb/MiniCPM-o-4_5
revision: eb4141de24550a3a1a4082f718be58f46b761728
speech_assets: ../outputs/speech-assets
speech_tokenizer: ../outputs/speech-assets/speech_tokenizer_v2_25hz.onnx
speech_tokenizer_sha256: d43342aa12163a80bf07bffb94c9de2e120a8df2f9917cd2f642e7f4219c6f71
# Replace development tones with correctly paired real utterances before useful SFT.
dataset: ../outputs/omni-data/train.jsonl
dataset_root: ../outputs/omni-data
output_dir: ../outputs/minicpm-omni-run
device: cuda
dtype: bfloat16
quantization: none
attention: sdpa
gradient_checkpointing: true
max_steps: 100
save_steps: 25
gradient_accumulation_steps: 8
max_length: 2048
max_audio_seconds: 10
max_codec_tokens: 300
video_fps: 1
max_video_frames: 10
max_video_seconds: 10
text_loss_weight: 1
speech_loss_weight: 1
components:
  language_model:
    mode: lora
    rank: 8
    alpha: 16
    lr: 0.0001
  speech_generator:
    mode: lora
    rank: 8
    alpha: 16
    lr: 0.0001
budget:
  max_examples: 1
  max_llm_tokens: 2048
  max_vision_patches: 16384
  max_audio_frames: 1000
  max_codec_frames: 512
  max_decoded_media_bytes: 16777216
