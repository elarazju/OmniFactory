# Pretrained 7B native speech path passed short H20 acceptance; requires exact native labels.
# Do not reuse 3B teacher labels. See docs/models.md#qwen-speech-labels for native-label provenance.
adapter: qwen2_5_omni
task: speech_sft
model: Qwen/Qwen2.5-Omni-7B
revision: ae9e1690543ffd5c0221dc27f79834d0294cba00
speech_codes: ../outputs/qwen7b-speech-data/speech_codes.jsonl
speech_speaker: Chelsie
dataset: ../outputs/qwen7b-speech-data/train.jsonl
output_dir: ../outputs/qwen2.5-omni-7b-speech-run
device: cuda
dtype: bfloat16
attention: sdpa
gradient_checkpointing: true
max_steps: 100
save_steps: 25
gradient_accumulation_steps: 2
max_length: 2048
max_audio_seconds: 10
max_codec_tokens: 750
video_fps: 2
max_video_frames: 20
max_video_seconds: 10
components:
  language_model:
    mode: lora
    rank: 4
    alpha: 8
    lr: 0.0001
  speech_generator:
    mode: lora
    rank: 4
    alpha: 8
    lr: 0.0001
budget:
  max_examples: 1
  max_llm_tokens: 2048
  max_vision_patches: 4096
  max_audio_frames: 3000
  max_codec_frames: 750
  max_decoded_media_bytes: 67108864
