# Eight non-streaming requests passed on one H20-3e (2026-10-26).
# This is not a minimum-memory or throughput recipe.
# Set base_config to your pinned vLLM-Omni checkout; see docs/deployment.md.
base_config: /path/to/vllm-omni/vllm_omni/deploy/qwen3_omni_moe.yaml
async_chunk: false
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    max_model_len: 4096
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.60
    kv_cache_memory_bytes: 2147483648
    enforce_eager: true
    enable_prefix_caching: false
    mm_processor_cache_gb: 0
    limit_mm_per_prompt: {image: 1, audio: 1, video: 1}
    media_io_kwargs:
      video: {fps: 1, num_frames: 4}
    default_sampling_params:
      temperature: 0.0
      max_tokens: 64
      seed: 42
  - stage_id: 1
    devices: "0"
    max_num_seqs: 1
    max_model_len: 4096
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.15
    kv_cache_memory_bytes: 536870912
    enforce_eager: true
    enable_prefix_caching: false
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 750
      seed: 42
      repetition_penalty: 1.05
      stop_token_ids: [2150]
  - stage_id: 2
    devices: "0"
    max_num_seqs: 1
    # 750 frames x 16 codec groups fit without inheriting the 65536 default.
    max_model_len: 16384
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.10
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: false
    default_sampling_params:
      temperature: 0.0
      max_tokens: 750
      seed: 42
