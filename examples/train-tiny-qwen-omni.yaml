# Native architecture fixture, random weights; see docs/models.md#qwen-speech-labels.
adapter: qwen2_5_omni
task: speech_sft
model: ../outputs/qwen-omni-model
speech_codes: ../outputs/qwen-speech-data/speech_codes.jsonl
speech_speaker: Chelsie
dataset: ../outputs/qwen-speech-data/train.jsonl
output_dir: ../outputs/qwen-omni-run
device: cpu
dtype: float32
attention: sdpa
gradient_checkpointing: true
max_steps: 4
save_steps: 2
gradient_accumulation_steps: 2
max_length: 512
max_audio_seconds: 1
max_codec_tokens: 128
video_fps: 2
max_video_frames: 4
max_video_seconds: 1
components:
  language_model:
    mode: lora
    rank: 4
    alpha: 8
    lr: 0.01
  speech_generator:
    mode: lora
    rank: 4
    alpha: 8
    lr: 0.01
budget:
  max_examples: 2
  max_llm_tokens: 1024
  max_vision_patches: 128
  max_audio_frames: 400
  max_codec_frames: 128
  max_decoded_media_bytes: 1000000
