# Paired speech pilot recipe. Use data from scripts/prepare_librispeech_tts.py.
# Paths are relative to this file; prepare once before `train`.
model: openbmb/VoxCPM2
revision: 32279effe8c19989596f05d353d1447f51d9e915
adapter: voxcpm2
task: speech_sft
dataset: ../outputs/tts-pilot/train.jsonl
validation_dataset: ../outputs/tts-pilot/validation.jsonl
prepared_dataset: ../outputs/voxcpm2-pilot-prepared
output_dir: ../outputs/voxcpm2-pilot-run
device: cuda
dtype: bfloat16
attention: sdpa
quantization: none
gradient_checkpointing: true
max_steps: 64
save_steps: 16
eval_steps: 16
save_total_limit: 3
lr_scheduler: cosine
scheduler_steps: 64
warmup_steps: 4
weight_decay: 0.01
gradient_accumulation_steps: 4
max_length: 4096
max_audio_seconds: 30
max_codec_tokens: 128
components:
  language_model: {mode: lora, rank: 4, alpha: 8, lr: 0.0001}
  residual_model: {mode: lora, rank: 4, alpha: 8, lr: 0.0001}
  audio_decoder: {mode: lora, rank: 4, alpha: 8, lr: 0.0001}
  speech_projection: {mode: full, lr: 0.00001}
  stop_predictor: {mode: full, lr: 0.00001}
budget:
  max_examples: 1
  max_llm_tokens: 4096
  max_vision_patches: 1
  max_audio_frames: 10000
  max_codec_frames: 10000
  max_latent_elements: 1000000
  max_decoded_media_bytes: 64000000
