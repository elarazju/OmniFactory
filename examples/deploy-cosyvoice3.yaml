# Two-stage native pipeline validated for LLM and flow fine-tuned exports.
model_runner: v1
async_chunk: false
dtype: bfloat16
stages:
- stage_id: 0
  devices: '0'
  max_num_seqs: 1
  max_model_len: 2048
  max_num_batched_tokens: 2048
  kv_cache_memory_bytes: 536870912
  gpu_memory_utilization: 0.5
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: false
  default_sampling_params:
    max_tokens: 256
    seed: 42
    top_k: 25
    top_p: 0.8
    repetition_penalty: 1.0001
  disable_hybrid_kv_cache_manager: true
  skip_mm_profiling: true
  mm_processor_cache_gb: 0
- stage_id: 1
  devices: '0'
  max_num_seqs: 1
  max_model_len: 8192
  max_num_batched_tokens: 8192
  gpu_memory_utilization: 0.2
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: false
  default_sampling_params:
    max_tokens: 256
    seed: 42
  disable_hybrid_kv_cache_manager: true
  skip_mm_profiling: true
pipeline: cosyvoice3
