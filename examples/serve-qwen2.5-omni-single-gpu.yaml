# H20 acceptance configuration: colocate all native stages on one large GPU.
# This is not a minimum-memory claim. Run serving after training has exited.
async_chunk: false
stages:
  - stage_id: 0
    devices: "0"
    max_model_len: 2048
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.30
    enforce_eager: true
    trust_remote_code: false
    enable_prefix_caching: false
    mm_processor_cache_gb: 0
    default_sampling_params:
      temperature: 0.0
      max_tokens: 64
      seed: 42
  - stage_id: 1
    devices: "0"
    max_model_len: 4096
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.20
    enforce_eager: true
    trust_remote_code: false
    enable_prefix_caching: false
    default_sampling_params:
      temperature: 0.9
      top_p: 0.8
      top_k: 40
      max_tokens: 750
      seed: 42
      repetition_penalty: 1.05
      stop_token_ids: [8294]
  - stage_id: 2
    devices: "0"
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: true
    trust_remote_code: false
    enable_prefix_caching: false
    enable_flashinfer_autotune: false
    async_scheduling: false
    default_sampling_params:
      temperature: 0.0
      max_tokens: 750
      seed: 42
