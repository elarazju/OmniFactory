# Two-stage CustomVoice configuration validated with a single-speaker Base SFT export.
model_runner: v1
async_chunk: false
dtype: bfloat16
stages:
- stage_id: 0
  devices: '0'
  max_num_seqs: 1
  max_model_len: 2048
  max_num_batched_tokens: 2048
  kv_cache_memory_bytes: 536870912
  gpu_memory_utilization: 0.5
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: false
  default_sampling_params:
    temperature: 0.9
    top_p: 1.0
    top_k: 50
    max_tokens: 256
    min_tokens: 2
    seed: 42
    repetition_penalty: 1.05
  subtalker_sampling_params:
    do_sample: true
    temperature: 0.9
    top_p: 1.0
    top_k: 50
- stage_id: 1
  devices: '0'
  max_num_seqs: 1
  max_model_len: 8192
  max_num_batched_tokens: 8192
  gpu_memory_utilization: 0.2
  enforce_eager: true
  trust_remote_code: true
  enable_prefix_caching: false
  default_sampling_params:
    temperature: 0.0
    max_tokens: 8192
    seed: 42
