[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "omnifactory-example-adapter"
version = "0.1.0"
description = "Synthetic onboarding fixture; not a new pretrained model"
requires-python = ">=3.11"
dependencies = ["omnifactory>=0.1.0a8,<0.2"]

[project.entry-points."omnifactory.adapters"]
example_qwen_fixture = "omnifactory_example:adapter_spec"

[project.scripts]
omnifactory-example-check = "omnifactory_example.check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnifactory_example"]
