adapter: example_qwen_fixture
task: understanding_sft
model: outputs/model
dataset: outputs/data/train.jsonl
validation_dataset: outputs/data/validation.jsonl
validation_root: outputs/data
output_dir: outputs/run
device: cpu
dtype: float32
quantization: none
attention: sdpa
gradient_checkpointing: false
heterogeneous_batches: true
max_steps: 2
save_steps: 1
max_length: 512
components:
  language_model: {mode: lora, rank: 2, alpha: 4, lr: 0.001}
budget:
  max_examples: 3
  max_llm_tokens: 1536
  max_vision_patches: 128
  max_audio_frames: 800
  max_codec_frames: 1
  max_decoded_media_bytes: 1000000
